name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Initialise example repos
        run: bash examples/setup.sh

      - name: Lint
        run: ruff check generate_index.py examples/vault/hooks/inject_manifest.py tests/

      - name: Test
        run: pytest tests/ -v

      - name: Verify committed index is current
        run: git diff --exit-code examples/vault/index/ examples/vault/index.json
